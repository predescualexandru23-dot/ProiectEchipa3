name: Azure Static Web App Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Setează Node.js 20.x (Vite cere minim 20.19)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # 3. Instalează dependențele frontend
      - name: Install dependencies
        run: npm install
        working-directory: frontend

      # 4. Build frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # 5. Deploy pe Azure Static Web Apps
      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend"          # folderul cu cod sursă
          output_location: "frontend/dist"  # folderul generat de vite build
