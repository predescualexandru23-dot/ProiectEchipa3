name: Azure Static Web Apps Deploy - Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout codul
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Setează Node.js compatibil cu Vite
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'   # Node >=20 necesar pentru Vite

      # 3. Instalează dependențele
      - name: Install dependencies
        run: npm install
        working-directory: frontend

      # 4. Build Vite
      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # 5. Deploy la Azure Static Web Apps
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend"         # folderul cu cod sursă React
          output_location: "frontend/dist" # folderul creat de vite build
